name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: url_monitor
          POSTGRES_PASSWORD: ${{ secrets.CI_POSTGRES_PASSWORD }}
          POSTGRES_DB: url_monitor_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U url_monitor -d url_monitor_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+asyncpg://url_monitor:${{ secrets.CI_POSTGRES_PASSWORD }}@localhost:5432/url_monitor_test
      TEST_DATABASE_URL: postgresql+asyncpg://url_monitor:${{ secrets.CI_POSTGRES_PASSWORD }}@localhost:5432/url_monitor_test
      # Valeur factice réservée à la CI, pas un vrai secret.
      JWT_SECRET: ci-only-dummy-jwt-secret-not-used-anywhere-else
      # Les `uv run` réutilisent l'environnement installé par `uv sync`, sans resynchroniser.
      UV_NO_SYNC: "1"

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: "0.13.8"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - run: uv sync --locked --no-build

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format
        run: uv run ruff format --check .

      - name: Mypy
        run: uv run mypy app

      - name: Migrations à jour avec les modèles
        run: uv run alembic upgrade head && uv run alembic check

      - name: Pytest
        run: uv run pytest
